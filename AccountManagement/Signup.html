<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — Upward</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&icon_names=home" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --accent: #FFD700;
            --border: 1px solid rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: Arial, sans-serif;
            color: white;
            background: radial-gradient(circle at 30% 20%, #0a0a4a, #020223);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            /* add this */
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            width: 200%;
            height: 200%;
            background-image: radial-gradient(white 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.05;
            animation: move 60s linear infinite;
            pointer-events: none;
        }

        @keyframes move {
            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(-200px, -200px);
            }
        }

        .signup-card {
            background: rgba(255, 255, 255, 0.02);
            border: var(--border);
            border-radius: 20px;
            padding: 48px;
            width: 100%;
            max-width: 440px;
            position: relative;
            z-index: 1;
        }

        .logo {
            font-family: 'Press Start 2P';
            font-size: 20px;
            color: var(--accent);
            text-align: center;
            margin-bottom: 8px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
        }

        .tagline {
            font-size: 12px;
            opacity: 0.4;
            text-align: center;
            margin-bottom: 36px;
        }

        .form-title {
            font-family: 'Press Start 2P';
            font-size: 11px;
            color: var(--accent);
            margin-bottom: 28px;
            opacity: 0.8;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            opacity: 0.5;
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            height: 46px;
            background: rgba(255, 255, 255, 0.05);
            border: var(--border);
            border-radius: 10px;
            color: white;
            font-family: Arial;
            font-size: 14px;
            padding: 0 16px;
            outline: none;
            transition: border-color .2s;
        }

        .input-group input:focus {
            border-color: var(--accent);
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        .strength-bar {
            height: 4px;
            border-radius: 2px;
            margin-top: 8px;
            background: rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }

        .strength-fill {
            height: 100%;
            border-radius: 2px;
            transition: width .3s, background .3s;
            width: 0%;
        }

        .strength-label {
            font-size: 10px;
            opacity: 0.4;
            margin-top: 4px;
        }

        .signup-btn {
            width: 100%;
            font-family: 'Press Start 2P';
            font-size: 10px;
            padding: 14px;
            background: var(--accent);
            color: #020223;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform .2s, box-shadow .2s;
            margin-top: 8px;
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .signup-btn::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transform: translateX(-100%);
            transition: transform .4s;
            pointer-events: none;
        }

        .signup-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
        }

        .signup-btn:hover::after {
            transform: translateX(100%);
        }

        .error-msg {
            background: rgba(255, 77, 77, 0.1);
            border: 1px solid #ff4d4d;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 12px;
            color: #ff8080;
            margin-top: 12px;
            display: none;
        }

        .terms {
            font-size: 11px;
            opacity: 0.4;
            margin-top: 16px;
            text-align: center;
            line-height: 1.7;
        }

        .terms a {
            color: var(--accent);
            text-decoration: none;
        }

        .login-link {
            text-align: center;
            margin-top: 16px;
            font-size: 12px;
            opacity: 0.5;
        }

        .login-link a {
            color: var(--accent);
            text-decoration: none;
        }

        .ToolBar {
            position: sticky;
            top: 0;
            z-index: 5;
            border-bottom: var(--border);
            background-color: #06063d;
            display: flex;
            align-items: center;
            padding: 15px 15px;
            box-shadow: var(--shadow);
        }

        .card-wrapper {
            flex: 1;
            /* takes remaining height */
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .material-symbols-outlined {
            color: #FFD700;
            font-size: 40px;
        }
    </style>
</head>

<body>
    <div class="ToolBar">
        <a href="../Starting-Page/index.html"><span class="material-symbols-outlined">home</span></a>
    </div>

    <div class="card-wrapper">
        <div class="signup-card">
            <div class="logo">Upward</div>
            <div class="tagline">Learn. Rank up. Rise.</div>
            <div class="form-title">Create Account</div>

            <div class="input-group">
                <label>Display Name</label>
                <input type="text" id="name" placeholder="Your name">
            </div>
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="your@email.com">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" oninput="checkStrength(this.value)">
                <div class="strength-bar">
                    <div class="strength-fill" id="strengthFill"></div>
                </div>
                <div class="strength-label" id="strengthLabel"></div>
            </div>
            <div class="input-group">
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="••••••••">
            </div>

            <button class="signup-btn" onclick="handleSignup()">Create Account</button>
            <div class="error-msg" id="errorMsg"></div>

            <div class="terms">By signing up you agree to our <a href="../Starting-Page/Terms.html">Terms of Service</a>
                and
                <a href="../Starting-Page/Privacy.html">Privacy Policy</a>
            </div>
            <div class="login-link">Already have an account? <a href="Login.html">Log in</a></div>
        </div>
    </div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDug8Iz8FkYck24-E8bFHyW-nt-PgXfvew",
            authDomain: "upward-44313.firebaseapp.com",
            projectId: "upward-44313",
            storageBucket: "upward-44313.firebasestorage.app",
            messagingSenderId: "101564287746",
            appId: "1:101564287746:web:a5b50c89520fadc006d01b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.checkStrength = function (val) {
            const fill = document.getElementById('strengthFill');
            const label = document.getElementById('strengthLabel');
            let strength = 0;
            if (val.length >= 6) strength++;
            if (val.length >= 10) strength++;
            if (/[A-Z]/.test(val)) strength++;
            if (/[0-9]/.test(val)) strength++;
            const colors = ['#ff4d4d', '#ffaa00', '#FFD700', '#00ff90'];
            const widths = ['25%', '50%', '75%', '100%'];
            const labels = ['Weak', 'Fair', 'Good', 'Strong'];
            if (strength > 0) {
                fill.style.width = widths[strength - 1];
                fill.style.background = colors[strength - 1];
                label.innerText = labels[strength - 1];
                label.style.color = colors[strength - 1];
            } else {
                fill.style.width = '0%';
                label.innerText = '';
            }
        }

        window.handleSignup = async function () {
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirmPassword').value;
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.style.display = 'none';

            if (!name || !email || !password || !confirm) {
                errorMsg.innerText = 'Please fill in all fields.';
                errorMsg.style.display = 'block';
                return;
            }
            if (password !== confirm) {
                errorMsg.innerText = 'Passwords do not match.';
                errorMsg.style.display = 'block';
                return;
            }
            if (password.length < 6) {
                errorMsg.innerText = 'Password must be at least 6 characters.';
                errorMsg.style.display = 'block';
                return;
            }

            try {
                const userCred = await createUserWithEmailAndPassword(auth, email, password);
                const uid = userCred.user.uid;

                await setDoc(doc(db, 'users', uid), {
                    name: name,
                    email: email,
                    xp: 0,
                    rankIndex: 0,
                    lessonsCompleted: 0,
                    createdAt: new Date().toISOString()
                });

                localStorage.setItem('current_user', uid);
                localStorage.setItem('user_name', name);
                localStorage.setItem('user_email', email);
                localStorage.setItem('xp', 0);
                localStorage.setItem('rankIndex', 0);
                localStorage.setItem('lessonsCompleted', 0);

                window.location.href = '../Courses/CourseMap.html';
            } catch (err) {
                errorMsg.style.display = 'block';
                if (err.code === 'auth/email-already-in-use') {
                    errorMsg.innerText = 'An account with this email already exists.';
                } else if (err.code === 'auth/invalid-email') {
                    errorMsg.innerText = 'Please enter a valid email address.';
                } else if (err.code === 'auth/weak-password') {
                    errorMsg.innerText = 'Password is too weak.';
                } else {
                    errorMsg.innerText = 'Signup failed. Please try again.';
                }
            }
        }

        document.addEventListener('keydown', e => { if (e.key === 'Enter') handleSignup(); });
    </script>
</body>

</html>
