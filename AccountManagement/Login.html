<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Upward</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&icon_names=home" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --accent: #FFD700;
            --border: 1px solid rgba(255, 255, 255, 0.08);
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
        }

        body {
            font-family: Arial, sans-serif;
            color: white;
            background: radial-gradient(circle at 30% 20%, #0a0a4a, #020223);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            /* stack toolbar and card vertically */
            overflow-x: hidden;
        }


        body::before {
            content: "";
            position: fixed;
            width: 200%;
            height: 200%;
            background-image: radial-gradient(white 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.05;
            animation: move 60s linear infinite;
            pointer-events: none;
        }

        @keyframes move {
            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(-200px, -200px);
            }
        }

        .login-card {
            background: rgba(255, 255, 255, 0.02);
            border: var(--border);
            border-radius: 20px;
            padding: 48px;
            width: 100%;
            max-width: 440px;
            position: relative;
            z-index: 1;
        }

        .logo {
            font-family: 'Press Start 2P';
            font-size: 20px;
            color: var(--accent);
            text-align: center;
            margin-bottom: 8px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
        }

        .tagline {
            font-size: 12px;
            opacity: 0.4;
            text-align: center;
            margin-bottom: 36px;
        }

        .form-title {
            font-family: 'Press Start 2P';
            font-size: 11px;
            color: var(--accent);
            margin-bottom: 28px;
            opacity: 0.8;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            opacity: 0.5;
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            height: 46px;
            background: rgba(255, 255, 255, 0.05);
            border: var(--border);
            border-radius: 10px;
            color: white;
            font-family: Arial;
            font-size: 14px;
            padding: 0 16px;
            outline: none;
            transition: border-color .2s;
        }

        .input-group input:focus {
            border-color: var(--accent);
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        .forgot-link {
            text-align: right;
            margin-top: -8px;
            margin-bottom: 20px;
            font-size: 11px;
            opacity: 0.5;
            transition: opacity .2s;
        }

        .forgot-link a {
            color: var(--accent);
            text-decoration: none;
        }

        .forgot-link:hover {
            opacity: 1;
        }

        .login-btn {
            width: 100%;
            font-family: 'Press Start 2P';
            font-size: 10px;
            padding: 14px;
            background: var(--accent);
            color: #020223;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform .2s, box-shadow .2s;
            margin-top: 8px;
            position: relative;
            overflow: hidden;
        }

        .login-btn::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transform: translateX(-100%);
            transition: transform .4s;
            pointer-events: none;
        }

        .login-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
        }

        .login-btn:hover::after {
            transform: translateX(100%);
        }

        .error-msg {
            background: rgba(255, 77, 77, 0.1);
            border: 1px solid #ff4d4d;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 12px;
            color: #ff8080;
            margin-top: 12px;
            display: none;
        }

        .signup-link {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            opacity: 0.5;
        }

        .signup-link a {
            color: var(--accent);
            text-decoration: none;
        }

        .signup-link a:hover {
            opacity: 0.8;
        }

        .home-button {
            position: fixed;
            top: 0;
            left: 0;
        }

        .ToolBar {
            position: sticky;
            top: 0;
            z-index: 5;
            border-bottom: var(--border);
            background-color: #06063d;
            display: flex;
            align-items: center;
            padding: 15px 15px;
            box-shadow: var(--shadow);
        }

        .card-wrapper {
            flex: 1;
            /* takes remaining height */
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .material-symbols-outlined {
            color: #FFD700;
            font-size: 40px;
        }
    </style>
</head>

<body>
    <div class="ToolBar">
        <a href="../Starting-Page/index.html"><span class="material-symbols-outlined">home</span></a>
    </div>
    <div class="card-wrapper">
        <div class="login-card">
            <div class="logo">Upward</div>
            <div class="tagline">Learn. Rank up. Rise.</div>
            <div class="form-title">Log In</div>

            <div class="input-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="your@email.com">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>

            <div class="forgot-link">
                <a href="ForgotPassword.html">Forgot password?</a>
            </div>

            <button class="login-btn" onclick="handleLogin()">Log In</button>
            <div class="error-msg" id="errorMsg"></div>

            <div class="signup-link">
                Don't have an account? <a href="Signup.html">Sign up</a>
            </div>
        </div>
    </div>
    <!-- Firebase SDK-uri -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="../firebase-init.js"></script>

    <script>
        async function handleLogin() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.style.display = 'none';

            if (!email || !password) {
                errorMsg.innerText = 'Please fill in all fields.';
                errorMsg.style.display = 'block';
                return;
            }

            try {
                await firebase.auth().signInWithEmailAndPassword(email, password);
                // Sesiunea e ținută de firebase.auth(); storage.init() pe pagina
                // următoare încarcă tot progresul din Firestore.
                window.location.href = '../Courses/CourseMap.html';
            } catch (err) {
                errorMsg.style.display = 'block';
                if (err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') {
                    errorMsg.innerText = 'Invalid email or password.';
                } else if (err.code === 'auth/invalid-email') {
                    errorMsg.innerText = 'Please enter a valid email address.';
                } else {
                    errorMsg.innerText = 'Login failed. Please try again.';
                }
            }
        }

        // Allow Enter key
        document.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });
    </script>
</body>

</html>
