<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — Upward</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --accent: #FFD700;
            --border: 1px solid rgba(255, 255, 255, 0.08);
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
        }

        body {
            font-family: Arial, sans-serif;
            color: white;
            background: radial-gradient(circle at 30% 20%, #0a0a4a, #020223);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            width: 200%;
            height: 200%;
            background-image: radial-gradient(white 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.05;
            animation: move 60s linear infinite;
            pointer-events: none;
        }

        @keyframes move {
            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(-200px, -200px);
            }
        }

        .reset-card {
            background: rgba(255, 255, 255, 0.02);
            border: var(--border);
            border-radius: 20px;
            padding: 48px;
            width: 100%;
            max-width: 440px;
            position: relative;
            z-index: 1;
        }

        .logo {
            font-family: 'Press Start 2P';
            font-size: 20px;
            color: var(--accent);
            text-align: center;
            margin-bottom: 8px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
        }

        .tagline {
            font-size: 12px;
            opacity: 0.4;
            text-align: center;
            margin-bottom: 36px;
        }

        .form-title {
            font-family: 'Press Start 2P';
            font-size: 11px;
            color: var(--accent);
            margin-bottom: 14px;
            opacity: 0.8;
        }

        .form-desc {
            font-size: 12px;
            opacity: 0.55;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            opacity: 0.5;
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            height: 46px;
            background: rgba(255, 255, 255, 0.05);
            border: var(--border);
            border-radius: 10px;
            color: white;
            font-family: Arial;
            font-size: 14px;
            padding: 0 16px;
            outline: none;
            transition: border-color .2s;
        }

        .input-group input:focus {
            border-color: var(--accent);
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        .reset-btn {
            width: 100%;
            font-family: 'Press Start 2P';
            font-size: 10px;
            padding: 14px;
            background: var(--accent);
            color: #020223;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform .2s, box-shadow .2s;
            margin-top: 8px;
            position: relative;
            overflow: hidden;
        }

        .reset-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .reset-btn::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transform: translateX(-100%);
            transition: transform .4s;
            pointer-events: none;
        }

        .reset-btn:not(:disabled):hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
        }

        .reset-btn:not(:disabled):hover::after {
            transform: translateX(100%);
        }

        .error-msg {
            background: rgba(255, 77, 77, 0.1);
            border: 1px solid #ff4d4d;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 12px;
            color: #ff8080;
            margin-top: 12px;
            display: none;
        }

        .success-msg {
            background: rgba(0, 255, 144, 0.08);
            border: 1px solid #00ff90;
            border-radius: 8px;
            padding: 14px;
            font-size: 12px;
            color: #00ff90;
            margin-top: 12px;
            line-height: 1.6;
            display: none;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            opacity: 0.5;
        }

        .back-link a {
            color: var(--accent);
            text-decoration: none;
        }

        .back-link a:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>
    <div class="reset-card">
        <div class="logo">Upward</div>
        <div class="tagline">Learn. Rank up. Rise.</div>
        <div class="form-title">Reset Password</div>
        <div class="form-desc">Enter the email associated with your account. We'll send you a link to reset your password.</div>

        <div class="input-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="your@email.com">
        </div>

        <button class="reset-btn" id="resetBtn" onclick="handleReset()">Send Reset Link</button>
        <div class="error-msg" id="errorMsg"></div>
        <div class="success-msg" id="successMsg"></div>

        <div class="back-link">
            Remember your password? <a href="Login.html">Back to Log In</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
        import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDug8Iz8FkYck24-E8bFHyW-nt-PgXfvew",
            authDomain: "upward-44313.firebaseapp.com",
            projectId: "upward-44313",
            storageBucket: "upward-44313.firebasestorage.app",
            messagingSenderId: "101564287746",
            appId: "1:101564287746:web:a5b50c89520fadc006d01b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        window.handleReset = async function () {
            const email = document.getElementById('email').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');
            const resetBtn = document.getElementById('resetBtn');

            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';

            if (!email) {
                errorMsg.innerText = 'Please enter your email address.';
                errorMsg.style.display = 'block';
                return;
            }

            resetBtn.disabled = true;
            resetBtn.innerText = 'Sending...';

            try {
                await sendPasswordResetEmail(auth, email);
                successMsg.innerText = 'Check your inbox. A password reset link has been sent to ' + email + '.';
                successMsg.style.display = 'block';
                resetBtn.innerText = 'Sent ✓';
            } catch (err) {
                resetBtn.disabled = false;
                resetBtn.innerText = 'Send Reset Link';
                errorMsg.style.display = 'block';
                if (err.code === 'auth/user-not-found') {
                    errorMsg.innerText = 'No account found with this email.';
                } else if (err.code === 'auth/invalid-email') {
                    errorMsg.innerText = 'Please enter a valid email address.';
                } else if (err.code === 'auth/too-many-requests') {
                    errorMsg.innerText = 'Too many attempts. Please wait a moment and try again.';
                } else {
                    errorMsg.innerText = 'Could not send reset email. Please try again.';
                }
            }
        }

        // Allow Enter key
        document.addEventListener('keydown', e => { if (e.key === 'Enter') handleReset(); });
    </script>
</body>

</html>
