<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tutor Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="../rankup.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #020223;
            --bg-mid: #06063d;
            --bg-light: #0a0a4a;
            --gold: #FFD700;
            --gold-dim: #b8960c;
            --violet: #9B6BFF;
            --violet-glow: rgba(155, 107, 255, 0.35);
            --gold-glow: rgba(255, 215, 0, 0.35);
            --border: 1px solid rgba(255, 255, 255, 0.12);
            --shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
            --font-display: 'Press Start 2P';
            --font-body: 'Space Grotesk', Arial, sans-serif;
        }

        body {
            font-family: var(--font-body);
            color: white;
            background:
                radial-gradient(circle at 15% 0%, rgba(155, 107, 255, 0.12), transparent 45%),
                radial-gradient(circle at 85% 100%, rgba(255, 215, 0, 0.10), transparent 45%),
                radial-gradient(circle at 30% 20%, #0a0a4a, #020223);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        @media (max-width: 768px) {
            body {
                height: 100dvh;
                overflow: auto;
            }
        }

        body::before {
            content: "";
            position: fixed;
            width: 200%;
            height: 200%;
            background-image: radial-gradient(white 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.05;
            animation: move 60s linear infinite;
            pointer-events: none;
        }

        @keyframes move {
            from { transform: translate(0, 0); }
            to { transform: translate(-200px, -200px); }
        }

        /* ===== TOOLBAR ===== */
        .ToolBar {
            position: sticky;
            top: 0;
            z-index: 5;
            background: linear-gradient(180deg, var(--bg-mid), rgba(6, 6, 61, 0.9));
            border-bottom: var(--border);
            display: flex;
            align-items: center;
            padding: 14px 0;
            box-shadow: var(--shadow);
            flex-shrink: 0;
            backdrop-filter: blur(6px);
        }

        .material-symbols-outlined {
            color: var(--gold);
            margin-left: 20px;
            font-size: 34px;
            cursor: pointer;
            transition: filter .2s, transform .2s;
        }

        .material-symbols-outlined:hover {
            filter: drop-shadow(0 0 8px var(--gold-glow));
            transform: scale(1.08);
        }

        .toolbar-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-family: var(--font-display);
            font-size: 12px;
            letter-spacing: 1px;
            color: var(--gold);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toolbar-title .bot-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--violet);
            box-shadow: 0 0 8px var(--violet-glow);
            animation: pulse-dot 2.2s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: .5; transform: scale(0.8); }
        }

        .chat-layout {
            flex: 1;
            display: grid;
            grid-template-columns: 270px 1fr;
            overflow: hidden;
        }

        /* ===== SIDEBAR ===== */
        .chat-sidebar {
            border-right: var(--border);
            padding: 18px 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: linear-gradient(180deg, rgba(255,255,255,0.025), rgba(255,255,255,0.01));
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.1) transparent;
        }

        .chat-sidebar::-webkit-scrollbar { width: 3px; }
        .chat-sidebar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); }

        .sidebar-section-title {
            font-family: var(--font-display);
            font-size: 8px;
            letter-spacing: 1px;
            color: var(--violet);
            opacity: 0.75;
            padding: 6px 2px 2px;
        }

        .new-chat-btn {
            font-family: var(--font-display);
            font-size: 9px;
            letter-spacing: .5px;
            padding: 13px;
            background: linear-gradient(135deg, var(--gold), #ffb700);
            color: #1a1400;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform .2s, box-shadow .2s;
            width: 100%;
        }

        .new-chat-btn:hover {
            transform: translateY(-1px) scale(1.01);
            box-shadow: 0 6px 20px var(--gold-glow);
        }

        /* TOPIC BUTTONS */
        .topic-btn {
            background: rgba(255, 255, 255, 0.035);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-left: 3px solid transparent;
            border-radius: 8px;
            padding: 10px 12px;
            color: rgba(255,255,255,0.85);
            font-size: 12.5px;
            text-align: left;
            cursor: pointer;
            transition: all .2s;
            line-height: 1.5;
            width: 100%;
        }

        .topic-btn:hover {
            background: rgba(155, 107, 255, 0.08);
            border-left-color: var(--violet);
            transform: translateX(3px);
        }

        .topic-btn.active {
            background: linear-gradient(90deg, rgba(255, 215, 0, 0.12), rgba(255,215,0,0.02));
            border-left-color: var(--gold);
            color: white;
        }

        .topic-btn .topic-tag {
            font-family: var(--font-display);
            font-size: 7px;
            letter-spacing: .5px;
            color: var(--gold);
            opacity: 0.8;
            display: block;
            margin-bottom: 5px;
        }

        /* SAVED CHATS */
        .saved-chat-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 8px;
            padding: 10px 12px;
            cursor: pointer;
            transition: all .2s;
            position: relative;
            width: 100%;
            text-align: left;
        }

        .saved-chat-item:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.18);
        }

        .saved-chat-item.active {
            border-color: var(--violet);
            background: rgba(155, 107, 255, 0.08);
        }

        .saved-chat-title {
            font-size: 12px;
            color: white;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
            padding-right: 14px;
        }

        .saved-chat-meta {
            font-size: 10px;
            opacity: 0.45;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .saved-chat-meta span:first-child {
            color: var(--violet);
            opacity: 0.9;
            font-weight: 600;
        }

        .delete-chat-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            font-size: 14px;
            padding: 0;
            line-height: 1;
            transition: color .2s;
            position: absolute;
            top: 8px;
            right: 8px;
        }

        .delete-chat-btn:hover { color: #ff5c5c; }

        .no-chats-msg {
            font-size: 11px;
            opacity: 0.3;
            text-align: center;
            padding: 10px 0;
        }

        /* ===== MAIN CHAT ===== */
        .chat-main {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .context-bar {
            padding: 10px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 12px;
            opacity: 0.55;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .context-bar span {
            color: var(--gold);
            opacity: 1;
            font-family: var(--font-display);
            font-size: 8px;
            letter-spacing: .5px;
        }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 22px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.1) transparent;
        }

        .messages-area::-webkit-scrollbar { width: 4px; }
        .messages-area::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 4px; }

        .msg-row {
            display: flex;
            gap: 10px;
            max-width: 72%;
            animation: rise-in .25s ease-out;
        }

        @keyframes rise-in {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
        .msg-row.ai { align-self: flex-start; }

        .msg-avatar {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            margin-top: 2px;
        }

        .msg-row.ai .msg-avatar {
            background: linear-gradient(145deg, var(--violet), #6b3fd6);
            box-shadow: 0 0 12px var(--violet-glow);
        }

        .msg-row.user .msg-avatar {
            background: linear-gradient(145deg, var(--gold), #c9a400);
            box-shadow: 0 0 12px var(--gold-glow);
        }

        .msg-col { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
        .msg-row.user .msg-col { align-items: flex-end; }
        .msg-row.ai .msg-col { align-items: flex-start; }

        .msg-label {
            font-family: var(--font-display);
            font-size: 7px;
            letter-spacing: .5px;
            opacity: 0.45;
        }

        .msg-bubble {
            padding: 13px 16px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.65;
        }

        .msg-row.user .msg-bubble {
            background: linear-gradient(135deg, var(--gold), #f0c400);
            color: #1a1400;
            border-bottom-right-radius: 4px;
            font-weight: 500;
        }

        .msg-row.ai .msg-bubble {
            background: rgba(255, 255, 255, 0.055);
            border: 1px solid rgba(155, 107, 255, 0.22);
            border-bottom-left-radius: 4px;
        }

        .typing-dots {
            display: flex;
            gap: 5px;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.055);
            border: 1px solid rgba(155, 107, 255, 0.22);
            border-radius: 14px;
            border-bottom-left-radius: 4px;
            width: fit-content;
        }

        .typing-dots span {
            width: 7px;
            height: 7px;
            background: var(--violet);
            border-radius: 50%;
            animation: bounce 1.2s infinite;
        }

        .typing-dots span:nth-child(2) { animation-delay: .2s; }
        .typing-dots span:nth-child(3) { animation-delay: .4s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); opacity: .5; }
            30% { transform: translateY(-5px); opacity: 1; }
        }

        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 0 30px 16px;
            flex-shrink: 0;
        }

        .suggestion-chip {
            background: rgba(155, 107, 255, 0.08);
            border: 1px solid rgba(155, 107, 255, 0.25);
            border-radius: 20px;
            padding: 7px 14px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.75);
            cursor: pointer;
            transition: all .2s;
        }

        .suggestion-chip:hover {
            background: rgba(255, 215, 0, 0.12);
            border-color: var(--gold);
            color: white;
            transform: translateY(-1px);
        }

        .input-area {
            border-top: var(--border);
            padding: 16px 20px;
            display: flex;
            gap: 12px;
            background: linear-gradient(0deg, var(--bg-mid), rgba(6,6,61,0.85));
            flex-shrink: 0;
        }

        .input-area textarea {
            flex: 1;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            color: white;
            font-family: var(--font-body);
            font-size: 14px;
            padding: 12px 16px;
            resize: none;
            outline: none;
            height: 48px;
            line-height: 1.5;
            transition: border-color .2s, box-shadow .2s;
            pointer-events: all;
        }

        .input-area textarea:focus {
            border-color: var(--violet);
            box-shadow: 0 0 0 3px var(--violet-glow);
        }

        .input-area textarea::placeholder { color: rgba(255, 255, 255, 0.3); }

        .send-btn {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--gold), #f0c400);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: transform .2s, box-shadow .2s;
        }

        .send-btn:hover {
            transform: scale(1.06);
            box-shadow: 0 0 16px var(--gold-glow);
        }

        .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

        .send-btn svg { width: 20px; height: 20px; fill: #1a1400; }

        .sidebar-toggle-btn { display: none; }

        @media (max-width: 768px) {
            body { height: 100dvh; overflow: hidden; }

            .toolbar-title { font-size: 10px; position: static; transform: none; flex: 1; justify-content: center; }

            .sidebar-toggle-btn {
                display: flex !important;
                align-items: center;
                justify-content: center;
                margin-left: 0;
                margin-right: 16px;
                background: none;
                border: none;
                color: var(--gold);
                font-size: 26px;
                cursor: pointer;
                flex-shrink: 0;
            }

            .chat-layout { grid-template-columns: 1fr; position: relative; height: calc(100dvh - 68px); overflow: hidden; }
            .chat-main { height: 100%; overflow: hidden; display: flex; flex-direction: column; }

            .chat-sidebar {
                position: fixed;
                top: 0;
                left: -100%;
                width: 80%;
                max-width: 300px;
                height: 100dvh;
                z-index: 100;
                background: #06063d;
                transition: left .3s ease;
                padding-top: 70px;
                border-right: var(--border);
            }

            .chat-sidebar.open { left: 0; }

            .sidebar-overlay {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.6);
                z-index: 99;
            }

            .sidebar-overlay.show { display: block; }

            .messages-area { flex: 1; overflow-y: auto; padding: 16px; min-height: 0; }
            .suggestions { padding: 0 12px 12px; flex-shrink: 0; }
            .suggestion-chip { font-size: 11px; padding: 6px 10px; }
            .msg-row { max-width: 92%; }
            .msg-bubble { font-size: 13px; padding: 10px 14px; }
            .input-area { padding: 10px 12px; flex-shrink: 0; }
        }
    </style>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-check-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-functions-compat.js"></script>

</head>

<body>

    <div class="ToolBar">
        <a href="../Courses/CourseMap.html">
            <span class="material-symbols-outlined">home</span>
        </a>
        <div class="toolbar-title"><span class="bot-dot"></span>AI Tutor</div>
        <button class="sidebar-toggle-btn" onclick="toggleSidebar()">☰</button>
    </div>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <div class="chat-layout">

        <div class="chat-sidebar">
            <button class="new-chat-btn" onclick="startNewChat()">+ New Chat</button>

            <p class="sidebar-section-title">Topics</p>
            <button class="topic-btn active" id="topic-general" onclick="setTopic(this, 'General', null)">
                <span class="topic-tag">General</span>
                Ask anything about HTML, CSS or Python
            </button>
            <button class="topic-btn" id="topic-html"
                onclick="setTopic(this, 'HTML', 'HTML — structure of web pages, tags, elements, attributes, semantic HTML')">
                <span class="topic-tag">HTML</span>
                Help with HTML structure and tags
            </button>
            <button class="topic-btn" id="topic-css"
                onclick="setTopic(this, 'CSS', 'CSS — styling web pages, selectors, flexbox, grid, colors, fonts, spacing')">
                <span class="topic-tag">CSS</span>
                Help with CSS styling and layouts
            </button>
            <button class="topic-btn" id="topic-python"
                onclick="setTopic(this, 'Python', 'Python — variables, conditions, loops, functions, lists, dictionaries, recursion')">
                <span class="topic-tag">Python</span>
                Help with Python programming
            </button>
            <button class="topic-btn" id="topic-practice"
                onclick="setTopic(this, 'Practice', 'Coding practice problems — give hints and guidance without giving away full solutions')">
                <span class="topic-tag">Practice</span>
                Get hints for practice problems
            </button>

            <p class="sidebar-section-title" style="margin-top:8px;">Saved Chats</p>
            <div id="savedChatsList"></div>
        </div>

        <div class="chat-main">
            <div class="context-bar">
                <span id="contextLabel">General</span>
                Tutor mode active
            </div>

            <div class="messages-area" id="messagesArea"></div>

            <div class="suggestions" id="suggestions">
                <button class="suggestion-chip" onclick="useSuggestion(this)">What is a CSS selector?</button>
                <button class="suggestion-chip" onclick="useSuggestion(this)">How do functions work in Python?</button>
                <button class="suggestion-chip" onclick="useSuggestion(this)">Difference between margin and
                    padding?</button>
                <button class="suggestion-chip" onclick="useSuggestion(this)">How does a for loop work?</button>
            </div>

            <div class="input-area">
                <textarea id="mainChatInput" placeholder="Ask your tutor anything..."></textarea>
                <button class="send-btn" id="mainSendBtn" onclick="sendMessage()">
                    <svg viewBox="0 0 24 24">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
                    </svg>
                </button>
            </div>
        </div>

    </div>

    <script src="../firebase-init.js"></script>

    <script>
        // ===== STATE =====
        let isLoading = false;
        let conversationHistory = [];
        let currentContext = null;
        let currentTopicName = 'General';
        let currentChatId = null;

        // ===== LOCALSTORAGE HELPERS =====
        function getAllChats() {
            try { return JSON.parse(localStorage.getItem('saved_chats') || '{}'); }
            catch (e) { return {}; }
        }

        function saveCurrentChat() {
            if (conversationHistory.length === 0) return;
            const chats = getAllChats();
            const id = currentChatId || ('chat_' + Date.now());
            currentChatId = id;

            const firstUserMsg = conversationHistory.find(m => m.role === 'user');
            const title = firstUserMsg ? firstUserMsg.content.slice(0, 40) + (firstUserMsg.content.length > 40 ? '...' : '') : 'New Chat';

            chats[id] = {
                id,
                title,
                topic: currentTopicName,
                context: currentContext,
                history: conversationHistory,
                updatedAt: Date.now()
            };

            localStorage.setItem('saved_chats', JSON.stringify(chats));
            renderSavedChats();
        }

        function deleteChat(id, e) {
            e.stopPropagation();
            const chats = getAllChats();
            delete chats[id];
            localStorage.setItem('saved_chats', JSON.stringify(chats));
            if (currentChatId === id) startNewChat();
            else renderSavedChats();
        }

        function loadChat(id) {
            const chats = getAllChats();
            const chat = chats[id];
            if (!chat) return;

            currentChatId = id;
            currentContext = chat.context;
            currentTopicName = chat.topic;
            conversationHistory = chat.history;

            document.getElementById('contextLabel').innerText = chat.topic;
            document.querySelectorAll('.topic-btn').forEach(b => b.classList.remove('active'));

            renderMessages();
            renderSavedChats();
            document.getElementById('suggestions').style.display = 'none';
        }

        function renderSavedChats() {
            const chats = getAllChats();
            const list = document.getElementById('savedChatsList');
            const sorted = Object.values(chats).sort((a, b) => b.updatedAt - a.updatedAt);

            if (sorted.length === 0) {
                list.innerHTML = '<p class="no-chats-msg">No saved chats yet</p>';
                return;
            }

            list.innerHTML = sorted.map(chat => {
                const date = new Date(chat.updatedAt);
                const dateStr = date.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
                const isActive = chat.id === currentChatId ? 'active' : '';
                return `
                <div class="saved-chat-item ${isActive}" onclick="loadChat('${chat.id}')">
                    <button class="delete-chat-btn" onclick="deleteChat('${chat.id}', event)">✕</button>
                    <div class="saved-chat-title">${chat.title}</div>
                    <div class="saved-chat-meta">
                        <span>${chat.topic}</span>
                        <span>${dateStr}</span>
                    </div>
                </div>
            `;
            }).join('');
        }

        function renderMessages() {
            const area = document.getElementById('messagesArea');
            area.innerHTML = '';
            conversationHistory.forEach(msg => {
                addMessageToUI(msg.role === 'user' ? 'user' : 'ai', msg.content);
            });
        }

        // ===== CHAT FUNCTIONS =====
        function startNewChat() {
            currentChatId = null;
            conversationHistory = [];
            currentContext = null;
            currentTopicName = 'General';
            document.getElementById('contextLabel').innerText = 'General';
            document.querySelectorAll('.topic-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('topic-general').classList.add('active');

            const area = document.getElementById('messagesArea');
            area.innerHTML = '';
            addMessageToUI('ai', "Hey! I'm your AI tutor. Ask me anything about HTML, CSS or Python!");
            document.getElementById('suggestions').style.display = 'flex';
            renderSavedChats();
        }

        function setTopic(btn, name, context) {
            document.querySelectorAll('.topic-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentContext = context;
            currentTopicName = name;
            document.getElementById('contextLabel').innerText = name;

            currentChatId = null;
            conversationHistory = [];
            const area = document.getElementById('messagesArea');
            area.innerHTML = '';
            addMessageToUI('ai', `Switched to <strong>${name}</strong> mode. ${context ? `Ask me anything about ${name}!` : 'Ask me anything about HTML, CSS or Python!'}`, true);
            document.getElementById('suggestions').style.display = 'none';
        }

        function useSuggestion(btn) {
            document.getElementById('mainChatInput').value = btn.innerText;
            document.getElementById('suggestions').style.display = 'none';
            sendMessage();
        }

        function getSystemPrompt() {
            return currentContext
                ? `You are a friendly encouraging AI tutor on a gamified programming learning platform. The student selected the topic: ${currentContext}. Focus your help on this area. Keep answers concise and beginner-friendly. Never give full solutions to coding problems — give hints and guidance. Use simple language. The student is a teenager learning to code.`
                : `You are a friendly encouraging AI tutor on a gamified programming learning platform teaching HTML, CSS and Python. Help students with programming questions. Keep answers concise and beginner-friendly. Never give full solutions — give hints and guidance. Use simple language. The student is a teenager learning to code.`;
        }

        async function sendMessage() {
            if (isLoading) return;
            const input = document.getElementById('mainChatInput');
            const text = input.value.trim();
            if (!text) return;

            document.getElementById('suggestions').style.display = 'none';
            input.value = '';
            input.style.height = '48px';

            addMessageToUI('user', text);
            conversationHistory.push({ role: 'user', content: text });

            isLoading = true;
            document.getElementById('mainSendBtn').disabled = true;
            const typingEl = addTyping();

            try {
                const callApi = firebase.functions().httpsCallable('api');
                const result = await callApi({
                    model: 'claude-haiku-4-5-20251001',
                    max_tokens: 1000,
                    system: getSystemPrompt(),
                    messages: conversationHistory
                });

                const reply = result.data.content[0].text;
                typingEl.remove();
                addMessageToUI('ai', reply);
                conversationHistory.push({ role: 'assistant', content: reply });
                saveCurrentChat();

            } catch (err) {
                typingEl.remove();
                addMessageToUI('ai', 'Sorry, I could not connect right now. Check your internet and try again.');
            }

            isLoading = false;
            document.getElementById('mainSendBtn').disabled = false;
        }

        function toggleSidebar() {
            document.querySelector('.chat-sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('show');
        }

        function addMessageToUI(role, text, allowHTML = false) {
            const area = document.getElementById('messagesArea');
            const row = document.createElement('div');
            row.className = `msg-row ${role}`;

            let content;
            if (allowHTML) {
                content = text.replace(/\n/g, '<br>');
            } else {
                content = text
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/\n/g, '<br>');
            }

            const avatarEmoji = role === 'user' ? '🙂' : '🤖';

            row.innerHTML = `
        <div class="msg-avatar">${avatarEmoji}</div>
        <div class="msg-col">
            <span class="msg-label">${role === 'user' ? 'You' : 'AI Tutor'}</span>
            <div class="msg-bubble">${content}</div>
        </div>
    `;
            area.appendChild(row);
            area.scrollTop = area.scrollHeight;
            return row;
        }

        function addTyping() {
            const area = document.getElementById('messagesArea');
            const row = document.createElement('div');
            row.className = 'msg-row ai';
            row.innerHTML = `
        <div class="msg-avatar">🤖</div>
        <div class="msg-col">
            <span class="msg-label">AI Tutor</span>
            <div class="typing-dots"><span></span><span></span><span></span></div>
        </div>`;
            area.appendChild(row);
            area.scrollTop = area.scrollHeight;
            return row;
        }

        // ===== INPUT EVENTS =====
        document.getElementById('mainSendBtn').addEventListener('click', sendMessage);
        document.getElementById('mainChatInput').addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });
        document.getElementById('mainChatInput').addEventListener('input', function () {
            this.style.height = '48px';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        // ===== INIT =====
        startNewChat();
        renderSavedChats();
    </script>

</body>

</html>
